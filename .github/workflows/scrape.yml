name: Aggiorna IPCA

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-ipca
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica e normalizza
        run: python scrape.py

      - name: Commit solo se i dati cambiano
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/ipca.csv)" ]]; then
            echo "Nessuna modifica nei dati"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipca.csv
          git commit -m "data: aggiorna IPCA"
          git push
